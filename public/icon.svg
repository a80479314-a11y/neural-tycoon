<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Beam gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#e9d5ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#e9d5ff;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Top face gradient (lighter) -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9d5ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.3"/>
    </linearGradient>
    
    <!-- Left face gradient -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.2"/>
    </linearGradient>
    
    <!-- Right face gradient (darker) -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:0.15"/>
    </linearGradient>
    
    <!-- Halo gradient -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0b0710"/>
  
  <!-- Halo under cube -->
  <ellipse cx="256" cy="320" rx="120" ry="40" fill="url(#haloGrad)"/>
  
  <!-- Light beam -->
  <rect x="252" y="80" width="8" height="140" fill="url(#beamGrad)" filter="url(#glow)"/>
  
  <!-- Isometric cube -->
  <g filter="url(#glow)">
    <!-- Top face (lightest) -->
    <path d="M 256 180 L 356 230 L 256 280 L 156 230 Z" 
          fill="url(#topGrad)" 
          stroke="#d8b4fe" 
          stroke-width="2" 
          stroke-opacity="0.7"/>
    
    <!-- Left face -->
    <path d="M 156 230 L 256 280 L 256 380 L 156 330 Z" 
          fill="url(#leftGrad)" 
          stroke="#d8b4fe" 
          stroke-width="2" 
          stroke-opacity="0.6"/>
    
    <!-- Right face (darkest) -->
    <path d="M 356 230 L 256 280 L 256 380 L 356 330 Z" 
          fill="url(#rightGrad)" 
          stroke="#d8b4fe" 
          stroke-width="2" 
          stroke-opacity="0.5"/>
  </g>
  
  <!-- Edge highlights -->
  <path d="M 256 180 L 256 280" stroke="#e9d5ff" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M 156 230 L 256 280 L 356 230" stroke="#e9d5ff" stroke-width="1" stroke-opacity="0.3"/>
</svg>
