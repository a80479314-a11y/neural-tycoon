<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Floor Grid -->
  <div class="floor">
    <div class="floor__grid"></div>
    <div class="floor__mask"></div>
  </div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Top Glow -->
  <div class="top-glow"></div>

  <!-- App Layout -->
  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1 class="header__title">Neural Tycoon</h1>
      <p class="header__subtitle">Построй империю нейросетей — от перцептрона до сингулярности</p>
    </header>

    <!-- HUD Chips -->
    <div class="hud">
      <div class="hud__chip">
        <span class="hud__chip-label">Баланс</span>
        <span class="hud__chip-value" data-hud="balance">0</span>
      </div>
      <div class="hud__chip">
        <span class="hud__chip-label">Доход</span>
        <span class="hud__chip-value" data-hud="income">+0/s</span>
      </div>
      <div class="hud__chip">
        <span class="hud__chip-label">Ключи</span>
        <span class="hud__chip-value" data-hud="keys">0</span>
      </div>
    </div>

    <!-- Center Stage — Isometric Cube -->
    <main class="stage">
      <div class="cube-wrapper">
        <div class="cube__beam"></div>
        <div class="cube-scene">
          <div class="cube">
            <div class="cube__face cube__face--top"></div>
            <div class="cube__face cube__face--bottom"></div>
            <div class="cube__face cube__face--front"></div>
            <div class="cube__face cube__face--back"></div>
            <div class="cube__face cube__face--left"></div>
            <div class="cube__face cube__face--right"></div>
          </div>
        </div>
        <div class="cube__ring"></div>
      </div>
    </main>

    <!-- Side Panel -->
    <aside class="side-panel">
      <div class="side-panel__title">Магазин модулей</div>
      <div class="side-panel__subtitle">закрываем потребности разработчика</div>
      <div class="shop" id="shop"></div>
    </aside>

    <!-- Bottom Controls -->
    <div class="controls">
      <button class="btn-buy" hidden>Купить</button>
    </div>

  </div>

  <!-- Reset Button -->
  <button class="btn-reset">сброс</button>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
