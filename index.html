<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Tycoon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Floor Grid -->
  <div class="floor">
    <div class="floor__grid"></div>
    <div class="floor__mask"></div>
  </div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- Top Glow -->
  <div class="top-glow"></div>

  <!-- App Layout -->
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header__row">
        <div>
          <h1 class="header__title">Neural Tycoon</h1>
          <p class="header__subtitle">Построй империю нейросетей — от перцептрона до сингулярности</p>
        </div>
        <button class="btn-research" id="research-open">Исследования</button>
      </div>
    </header>

    <!-- Quests Bar -->
    <div class="quests-bar" id="quests"></div>

    <!-- HUD Chips -->
    <div class="hud">
      <div class="hud__chip">
        <span class="hud__chip-label">Баланс</span>
        <span class="hud__chip-value" data-hud="balance">0</span>
      </div>
      <div class="hud__chip">
        <span class="hud__chip-label">Доход</span>
        <span class="hud__chip-value" data-hud="income">+0/s</span>
      </div>
      <div class="hud__chip">
        <span class="hud__chip-label">Ключи</span>
        <span class="hud__chip-value" data-hud="keys">0</span>
      </div>
      <div class="hud__chip">
        <span class="hud__chip-label">Наука</span>
        <span class="hud__chip-value" data-hud="science">0</span>
      </div>
    </div>

    <!-- Center Stage — Isometric Map Canvas -->
    <main class="stage">
      <canvas id="map" class="map-canvas"></canvas>
      <div class="stage__hint">ядро — сердце сети. Доход приносят модули</div>
    </main>

    <!-- Side Panel -->
    <aside class="side-panel">
      <div class="side-panel__title">Контракты</div>
      <div class="contracts" id="contracts"></div>

      <div class="side-panel__title" style="margin-top:24px">Магазин модулей</div>
      <div class="side-panel__subtitle">закрываем потребности разработчика</div>
      <div class="shop" id="shop"></div>

      <div class="side-panel__title" style="margin-top:24px">Апгрейды</div>
      <div class="upgrades" id="upgrades"></div>

      <div class="side-panel__title" style="margin-top:24px">Менеджеры</div>
      <div class="managers" id="managers"></div>
    </aside>

    <!-- Bottom Controls -->
    <div class="controls">
      <button class="btn-buy" hidden>Купить</button>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast" style="display:none"></div>

  <!-- Stamp -->
  <div class="stamp" id="stamp" style="display:none">
    <span>100% GENUINE<br/>ZERO SPOOFING</span>
  </div>

  <!-- Reset Button -->
  <button class="btn-reset">сброс</button>

  <!-- Research Overlay -->
  <div class="research-overlay" id="research-overlay" style="display:none">
    <div class="research__header">
      <h2 class="research__title">Дерево технологий</h2>
      <button class="research__close" id="research-close">✕</button>
    </div>
    <div class="research__content"></div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
